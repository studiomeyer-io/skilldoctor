name: CodeQL

# GitHubs statische Analyse (SAST). Befunde landen im Security-Tab des Repos.
# `build-mode: none` ist fuer ein TypeScript-Projekt richtig: CodeQL liest
# den Quelltext direkt, ohne Uebersetzungsschritt.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '49 3 * * 1' # montags 03:49 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
